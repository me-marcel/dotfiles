set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour214

set -g status-interval 5
set -g status-style bg=colour234,fg=colour250
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=colour214,bold] #S #[fg=colour240]|"
set -g status-right "#[fg=colour245]CPU #(awk '/cpu /{printf \"%.1f%%\", ($2+$4)*100/($2+$4+$5)}' /proc/stat) #[fg=colour245]MEM #(free -h | awk '/Mem:/ {print $3\"/\"$2}') #[fg=colour214]%Y-%m-%d %H:%M "
setw -g window-status-format "#[fg=colour245] #I:#W "
setw -g window-status-current-format "#[bg=colour214,fg=colour234,bold] #I:#W "

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
